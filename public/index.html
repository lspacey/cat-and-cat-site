<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2cats.club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(800px, 100vw, 100vh);
      height: min(800px, 100vw, 100vh);
      flex-shrink: 0;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      position: relative;
    }

    .image-wrapper img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: opacity 0.32s ease, transform 0.32s cubic-bezier(0,0,0.2,1);
      color: transparent;
      font-size: 0;
      background: transparent;
    }
    .image-wrapper img.layer-a { z-index: 1; }
    .image-wrapper img.layer-b { z-index: 2; }
    .image-wrapper img.layer-c { z-index: 1; }
    .image-wrapper img.hidden  { opacity: 0; pointer-events: none; }

    .image-wrapper img.slide-out-left  { transform: translateX(-60px); opacity: 0; }
    .image-wrapper img.slide-out-right { transform: translateX(60px);  opacity: 0; }
    .image-wrapper img.slide-in-left   { transform: translateX(60px);  opacity: 0; transition: none; }
    .image-wrapper img.slide-in-right  { transform: translateX(-60px); opacity: 0; transition: none; }

    /* ── Hint ── */
    .hint {
      position: absolute;
      left: 50%;
      top: -80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%) translateY(-10px) scale(0.85);
      transition: opacity 0.45s cubic-bezier(0.34,1.56,0.64,1),
                  transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    .hint.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }
    .hint.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-14px) scale(0.78);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .hint-label {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-style: italic;
      color: #555;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    /* ── Hamburger menu ── */
    .menu-btn {
      position: fixed;
      top: 12px;
      left: 16px;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px;
      opacity: 0.45;
      transition: opacity 0.25s ease;
    }
    .menu-btn:hover { opacity: 0.8; }
    .menu-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: #555;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .menu-dropdown {
      position: fixed;
      top: 48px;
      left: 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      padding: 6px 0;
      z-index: 25;
      min-width: 130px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.92);
      transition: opacity 0.25s cubic-bezier(0.34,1.56,0.64,1),
                  transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .menu-dropdown.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .menu-dropdown a {
      display: block;
      padding: 8px 20px;
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-style: italic;
      color: #555;
      letter-spacing: 0.03em;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .menu-dropdown a:hover {
      background: #f5f5f5;
      color: #333;
    }

    /* ── Bottom row ── */
    .bottom-row {
      position: absolute;
      bottom: -46px;
      left: 0;
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* ── Progress dots ── */
    .progress {
      display: flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
    }
    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
      transition: background 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .progress-dot.active { background: #666; transform: scale(1.5); }

    /* ── Back button ── */
    .back-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .back-btn.visible {
      opacity: 0.45;
      pointer-events: auto;
      transform: scale(1);
    }
    .back-btn:hover  { opacity: 0.8 !important; color: #444; }
    .back-btn.pressing { transform: scale(0.9) !important; }
    .back-btn svg    { display: block; }

    /* ── Next button (wraps countdown ring) ── */
    .next-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      flex-shrink: 0;
    }
    .next-btn.visible {
      opacity: 0.45;
      pointer-events: auto;
      transform: scale(1);
    }
    .next-btn:hover  { opacity: 0.8 !important; color: #444; }
    .next-btn.pressing { transform: scale(0.9) !important; }
    .next-btn svg    { display: block; }

    /* ── Countdown ring ── */
    .countdown-ring {
      width: 20px;
      height: 20px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .countdown-ring .track  { fill: none; stroke: #ddd; stroke-width: 1.5; }
    .countdown-ring .fill   {
      fill: none;
      stroke: #888;
      stroke-width: 1.5;
      stroke-linecap: round;
      transform-origin: 10px 10px;
      transform: rotate(-90deg);
      stroke-dasharray: 50.27;
      stroke-dashoffset: 0;
    }
    .countdown-ring .arrow  {
      stroke: #888;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* ── Loading spinner ── */
    .spinner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }
    .spinner.visible { opacity: 1; }
    .spinner svg {
      width: 48px;
      height: 48px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  
body {
  transition: background-color 0.35s ease, color 0.35s ease;
}

body.day {
  background-color: #ffffff;
  color: #333333;
}

body.night {
  background-color: #111111;
  color: #f2f2f2;
}

body.night .hint-label,
body.night .back-btn,
body.night .next-btn,
body.night .progress-dot,
body.night .menu-btn {
  color: #e5e5e5;
}

body.night .progress-dot {
  background: #666;
}

body.night .progress-dot.active {
  background: #f0f0f0;
}

body.night .countdown-ring .track {
  stroke: rgba(255,255,255,0.18);
}

body.night .countdown-ring .fill,
body.night .countdown-ring .arrow {
  stroke: #f0f0f0;
}

body.night .menu-btn span {
  background: #e5e5e5;
}
body.night .menu-dropdown {
  background: #222;
  border-color: #444;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
body.night .menu-dropdown a {
  color: #ccc;
}
body.night .menu-dropdown a:hover {
  background: #333;
  color: #f2f2f2;
}

</style>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="menu-dropdown" id="menuDropdown">
    <a href="memes/">memes</a>
    <a href="https://2cats.club/local/snapshots/index.html">feeding</a>
  </div>

<div class="scene" id="scene">

  <div class="hint" id="hint">
    <span class="hint-label">click or swipe</span>
    <svg width="38" height="44" viewBox="0 0 38 44" fill="none">
      <path d="M10 2 C6 14,18 28,22 40" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 40 L14 36 M22 40 L28 34" stroke="#888" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="image-wrapper" id="wrapper">
    <img class="layer-a" id="imgA" src="" alt="" draggable="false">
    <img class="layer-b hidden" id="imgB" src="" alt="" draggable="false">
    <img class="layer-c hidden" id="imgC" src="" alt="" draggable="false">
    <div class="spinner" id="spinner">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="18" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
        <path d="M22 4 A18 18 0 0 1 40 22" stroke="rgba(255,255,255,0.75)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="bottom-row">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
        <polyline points="11,6 7,10 11,14"
          stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="progress" id="progressDots"></div>

    <button class="next-btn" id="nextBtn" aria-label="Forward">
      <svg class="countdown-ring" id="countdownRing" viewBox="0 0 20 20">
        <circle class="track" cx="10" cy="10" r="8"/>
        <circle class="fill"  cx="10" cy="10" r="8"/>
        <!-- Right arrow inside ring -->
        <polyline class="arrow" points="9,6 13,10 9,14"/>
      </svg>
    </button>
  </div>

</div>
<script>
  let N = 206; // will be overridden by config.json
  const SLIDESHOW_T = 60;

  const pad    = n => String(n).padStart(4, '0');
  const imgUrl = n => `image/${pad(n)}.jpg`;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ── State ──
  let deck = [];
  let pos  = 0;
  let busy = false; // true while loading/transitioning

  
const scene = document.getElementById('scene');

function applyTheme(theme) {
  document.body.classList.toggle('night', theme === 'night');
  document.body.classList.toggle('day', theme !== 'night');
  localStorage.setItem('theme', theme);
}

function toggleTheme() {
  const isNight = document.body.classList.contains('night');
  applyTheme(isNight ? 'day' : 'night');
}

const savedTheme = localStorage.getItem('theme') || 'day';
applyTheme(savedTheme);
if (!document.body.classList.contains('day') && !document.body.classList.contains('night')) applyTheme('day');

const imgA = document.getElementById('imgA');
  const imgB = document.getElementById('imgB');
  const imgC = document.getElementById('imgC');
  const layers = [imgA, imgB, imgC];
  let activeLayer = imgA;
  // Round-robin: returns the layer that is neither activeLayer nor the one being preloaded
  // For 3-layer system: next is the layer after active in rotation
  const layerName = l => l === imgA ? 'a' : l === imgB ? 'b' : 'c';
  const inactiveLayer = () => {
    const idx = layers.indexOf(activeLayer);
    return layers[(idx + 1) % 3];
  };

  function buildDeck() {
    deck = shuffle(Array.from({ length: N + 1 }, (_, i) => i));
    pos  = 0;
  }

  function removeFromDeck(num) {
    return;
    const idx = deck.indexOf(num);
    if (idx === -1) return;
    deck.splice(idx, 1);
    if (idx < pos) pos--;
    // clamp
    if (pos >= deck.length) pos = Math.max(0, deck.length - 1);
  }

  // ── Dots ──
  const progressEl = document.getElementById('progressDots');
  function updateDots() {
    const DOTS = 20;
    progressEl.innerHTML = '';
    const activeDot = Math.min(Math.floor(pos / deck.length * DOTS), DOTS - 1);
    for (let i = 0; i < DOTS; i++) {
      const d = document.createElement('div');
      d.className = 'progress-dot' + (i === activeDot ? ' active' : '');
      progressEl.appendChild(d);
    }
  }

  // ── Back button ──
  const spinnerEl = document.getElementById('spinner');
  let loadingTimer = null; // delay before showing spinner (avoid flash on fast loads)

  function showSpinner() {
    clearTimeout(loadingTimer);
    loadingTimer = setTimeout(() => spinnerEl.classList.add('visible'), 150);
  }
  function hideSpinner() {
    clearTimeout(loadingTimer);
    spinnerEl.classList.remove('visible');
  }

  const backBtn = document.getElementById('backBtn');
  function updateBackBtn() {
    backBtn.classList.add('visible');
    document.getElementById('nextBtn').classList.add('visible');
  }

  function pressBtn(btn) {
    btn.classList.add('pressing');
    setTimeout(() => btn.classList.remove('pressing'), 200);
  }
  backBtn.addEventListener('click', e => {
    e.stopPropagation();
    pressBtn(backBtn);
    userInteraction();
    hideHint(() => navigate(-1));
  });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.addEventListener('click', e => {
    e.stopPropagation();
    pressBtn(nextBtn);
    hideHint(() => navigate(1));
  });

  // ── Hint ──
  const hint    = document.getElementById('hint');
  let hintShown = false;

  function showHint() {
    hint.classList.remove('hiding');
    void hint.offsetWidth;
    hint.classList.add('visible');
    hintShown = true;
  }
  function hideHint(cb) {
    if (!hintShown) { if (cb) cb(); return; }
    hint.classList.remove('visible');
    hint.classList.add('hiding');
    hint.addEventListener('transitionend', () => {
      hintShown = false;
      if (cb) cb();
    }, { once: true });
  }

  // ── Ring (rAF-driven) ──
  const ringEl   = document.getElementById('countdownRing');
  const ringFill = ringEl.querySelector('.fill');
  const CIRC     = 50.27;
  let ringStart  = null;
  let ringRaf    = null;

  function ringTick(now) {
    if (ringStart === null) return;
    const frac = Math.min((now - ringStart) / (SLIDESHOW_T * 1000), 1);
    ringFill.style.strokeDashoffset = frac * CIRC;
    if (frac < 1) ringRaf = requestAnimationFrame(ringTick);
    // when frac===1 the RAF stops; the separately-scheduled setTimeout fires autoAdvance
  }

  function startRing() {
    if (ringRaf) cancelAnimationFrame(ringRaf);
    ringFill.style.strokeDashoffset = 0;
    ringStart = performance.now();
    ringRaf = requestAnimationFrame(ringTick);
  }

  function stopRing() {
    if (ringRaf) { cancelAnimationFrame(ringRaf); ringRaf = null; }
    ringStart = null;
    ringFill.style.strokeDashoffset = 0;
  }

  // ── Slideshow timer ──
  // Key fix: one single timer variable; ring and timer always start/stop together.
  // scheduleNext() is called ONLY from two places:
  //   1. after first image loads (init)
  //   2. after each transition completes (inside showCurrent's onDone callback)
  // This guarantees pos is always settled before the next timeout is scheduled.

  let slideshowTimer = null;

  function scheduleNext() {
    clearTimeout(slideshowTimer);
    startRing();
    slideshowTimer = setTimeout(() => {
      pos = pos >= deck.length - 1 ? 0 : pos + 1;
      showCurrent('left');
      // next scheduleNext() will be called inside showCurrent's onDone
    }, SLIDESHOW_T * 1000);
  }

  function cancelSchedule() {
    clearTimeout(slideshowTimer);
    slideshowTimer = null;
    stopRing();
  }

  // User interacted — reset timer
  function userInteraction() {
    cancelSchedule();
    scheduleNext();
  }

  ['mousedown','keydown','touchstart'].forEach(ev =>
    window.addEventListener(ev, userInteraction, { passive: true })
  );

  // ── Preload ──
  let preloadImg = new Image();
  function preloadNext() {
    if (pos + 1 >= deck.length) return;
    preloadImg = new Image();
    preloadImg.src = imgUrl(deck[pos + 1]);
  }

  // ── Transition ──
  function showCurrent(direction) {
    if (!deck.length) return;
    busy = true;

    const num  = deck[pos];
    const next = inactiveLayer();
    const curr = activeLayer;

    const inCls  = direction === 'left' ? 'slide-in-left'  : 'slide-in-right';
    const outCls = direction === 'left' ? 'slide-out-left' : 'slide-out-right';

    next.onload  = null;
    next.onerror = null;
    next.src       = imgUrl(num);
    next.className = `layer-${layerName(next)} ${inCls}`;
    next.style.zIndex = 3;
    curr.style.zIndex = 2;

    function onSettled() {
      if (onSettled.done) return;
      onSettled.done = true;
      busy = false;
      hideSpinner();
      curr.className    = `layer-${layerName(curr)} hidden`;
      curr.style.zIndex = '';
      next.style.zIndex = '';
      next.className    = `layer-${layerName(next)}`;
      next.style.opacity   = '';
      next.style.transform = '';
      activeLayer = next;
      updateDots();
      updateBackBtn();
      preloadNext();
      scheduleNext();
    }

    function settle() {
      // Double rAF ensures browser has painted the initial (off-screen) state
      // before starting the transition — guarantees transitionend fires.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        next.classList.remove(inCls);
        next.style.opacity   = '1';
        next.style.transform = 'translateX(0)';
        curr.classList.add(outCls);

        next.addEventListener('transitionend', function h(e) {
          if (e.propertyName !== 'opacity') return;
          next.removeEventListener('transitionend', h);
          clearTimeout(fallbackTimer);
          onSettled();
        });

        // Fallback in case transitionend never fires (hidden tab, reduced-motion, etc.)
        const fallbackTimer = setTimeout(onSettled, 400);
      }));
    }

    if (next.complete && next.naturalWidth) {
      settle();
    } else {
      showSpinner();
      next.onload  = () => { hideSpinner(); settle(); };
      next.onerror = () => {
        busy = false;
        hideSpinner();
        removeFromDeck(num);
        next.className    = `layer-${layerName(next)} hidden`;
        next.style.zIndex = '';
        curr.style.zIndex = '';
        if (deck.length > 0) showCurrent(direction);
        else onSettled();
      };
    }
  }

  // ── Navigate ──
  function navigate(delta) {
    if (busy) return; // ignore clicks during load/transition
    if (delta > 0) {
      pos = pos >= deck.length - 1 ? 0 : pos + 1;
    } else {
      pos = pos <= 0 ? deck.length - 1 : pos - 1;
    }
    cancelSchedule();
    showCurrent(delta > 0 ? 'left' : 'right');
    // scheduleNext() will fire inside showCurrent → onSettled
  }

  // ── Click / swipe ──
  const wrapper = document.getElementById('wrapper');

  wrapper.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    const rect = wrapper.getBoundingClientRect();
    const isLeft = e.clientX < rect.left + rect.width / 2;
    pressBtn(isLeft ? backBtn : nextBtn);
    hideHint(() => navigate(isLeft ? -1 : 1));
  });

  let tx = 0, ty = 0, suppressClick = false;
  wrapper.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    suppressClick = false;
  }, { passive: true });
  wrapper.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 30 || Math.abs(dy) > Math.abs(dx) * 0.8) return;
    suppressClick = true;
    if (dx < 0) { pressBtn(nextBtn); hideHint(() => navigate(1)); }
    else         { pressBtn(backBtn); hideHint(() => navigate(-1)); }
  }, { passive: true });

  document.addEventListener('click', (e) => {
  if (e.target.closest('.back-btn, .next-btn, .image-wrapper, .menu-btn, .menu-dropdown')) return;
  toggleTheme();
}, true);

scene.addEventListener('click', (e) => {
  if (e.target.closest('.back-btn, .next-btn, .image-wrapper, .menu-btn, .menu-dropdown')) return;
  toggleTheme();
}, true);

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') hideHint(() => navigate(1));
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   hideHint(() => navigate(-1));
  });

  // ── Menu toggle ──
  const menuBtn    = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!menuDropdown.classList.contains('open')) return;
    if (!e.target.closest('.menu-btn') && !e.target.closest('.menu-dropdown')) {
      menuDropdown.classList.remove('open');
    }
  });

  // ── Init ──
  function init() {
    buildDeck();
    activeLayer.style.opacity = '0';
    activeLayer.src = imgUrl(deck[0]);

  activeLayer.onload = () => {
    activeLayer.onload  = null;
    activeLayer.onerror = null;
    activeLayer.style.transition = 'opacity 0.5s ease';
    activeLayer.style.opacity    = '1';
    setTimeout(() => {
      activeLayer.style.transition = '';
      activeLayer.style.opacity    = '';
    }, 520);
    updateDots();
    updateBackBtn();
    preloadNext();
    setTimeout(showHint, 600);
    scheduleNext();
  };

  activeLayer.onerror = () => {
    removeFromDeck(deck[0]);
    pos = 0;
    if (deck.length > 0) {
      activeLayer.src = imgUrl(deck[0]);
    }
  };
  } // end init()

  // Load config.json, validate N, then start
  fetch('config.json')
    .then(r => r.json())
    .then(cfg => {
      const parsed = parseInt(cfg.N, 10);
      N = (Number.isFinite(parsed) && parsed > 0) ? parsed : 206;
    })
    .catch(() => { N = 206; })
    .finally(() => {
      document.title += ' - ' + (N + 1);
      init();
    });
</script>
</body>
</html>
