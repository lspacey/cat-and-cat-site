<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2cats.club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-wrapper {
      width: 800px;
      height: 800px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 800px;
      height: 800px;
      display: block;
      object-fit: cover;
      transition: opacity 0.25s ease;
    }

    .image-wrapper img.fading {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="image-wrapper" id="wrapper">
    <img id="photo" src="" alt="Random cat photo" draggable="false">
  </div>

  <script>
    const N = 13; // max image index (inclusive), change as needed

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function randomIndex(exclude) {
      let idx;
      do {
        idx = Math.floor(Math.random() * (N + 1));
      } while (idx === exclude && N > 0);
      return idx;
    }

    let currentIndex = null;

    function loadImage(idx) {
      const img = document.getElementById('photo');
      img.classList.add('fading');
      setTimeout(() => {
        img.src = `image/${pad(idx)}.jpg`;
        img.onload = () => img.classList.remove('fading');
        img.onerror = () => img.classList.remove('fading');
      }, 250);
      currentIndex = idx;
    }

    // Initial load
    currentIndex = randomIndex(-1);
    const imgEl = document.getElementById('photo');
    imgEl.src = `image/${pad(currentIndex)}.jpg`;

    // Click handler
    document.getElementById('wrapper').addEventListener('click', () => {
      const next = randomIndex(currentIndex);
      loadImage(next);
    });
  </script>
</body>
</html>
