<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2cats.club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(800px, 100vw, 100vh);
      height: min(800px, 100vw, 100vh);
      flex-shrink: 0;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: opacity 0.25s ease;
    }

    .image-wrapper img.fading {
      opacity: 0;
    }

    .hint {
      position: absolute;
      left: 50%;
      top: -76px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .hint.appearing {
      animation: hint-appear 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .hint.hiding {
      animation: hint-disappear 0.35s ease-in forwards;
    }

    @keyframes hint-appear {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-14px) scale(0.82); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0)      scale(1); }
    }

    @keyframes hint-disappear {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0)      scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-18px)  scale(0.78); }
    }

    .hint-label {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-style: italic;
      color: #555;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">

    <div class="hint appearing" id="hint">
      <span class="hint-label">click us</span>
      <svg width="38" height="44" viewBox="0 0 38 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2 C6 14, 18 28, 22 40" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M22 40 L14 36 M22 40 L28 34" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <div class="image-wrapper" id="wrapper">
      <img id="photo" src="" alt="Random cat photo" draggable="false">
    </div>

  </div>

  <script>
    const N = 23;

    function pad(n) {
      return String(n).padStart(4, '0');
    }

    function randomIndex(exclude) {
      let idx;
      do {
        idx = Math.floor(Math.random() * (N + 1));
      } while (idx === exclude && N > 0);
      return idx;
    }

    let currentIndex = null;
    let hintTimer = null;

    const hint = document.getElementById('hint');

    function showHint() {
      hint.style.display = 'flex';
      // re-trigger animation
      hint.classList.remove('appearing', 'hiding');
      void hint.offsetWidth; // reflow
      hint.classList.add('appearing');
    }

    function hideHint(callback) {
      hint.classList.remove('appearing');
      hint.classList.add('hiding');
      hint.addEventListener('animationend', () => {
        hint.style.display = 'none';
        if (callback) callback();
      }, { once: true });
    }

    function loadImage(idx) {
      const img = document.getElementById('photo');
      img.classList.add('fading');
      setTimeout(() => {
        img.src = `image/${pad(idx)}.jpg`;
        const done = () => {
          img.classList.remove('fading');
          // Show hint again after image loaded, small delay for smoothness
          clearTimeout(hintTimer);
          hintTimer = setTimeout(showHint, 400);
        };
        img.onload = done;
        img.onerror = done;
      }, 250);
      currentIndex = idx;
    }

    // Initial load
    currentIndex = randomIndex(-1);
    document.getElementById('photo').src = `image/${pad(currentIndex)}.jpg`;

    document.getElementById('wrapper').addEventListener('click', () => {
      clearTimeout(hintTimer);
      hideHint(() => {
        loadImage(randomIndex(currentIndex));
      });
    });
  </script>
</body>
</html>
