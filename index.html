<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2cats.club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(800px, 100vw, 100vh);
      height: min(800px, 100vw, 100vh);
      flex-shrink: 0;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: opacity 0.25s ease;
    }

    .image-wrapper img.fading {
      opacity: 0;
    }

    /* Hint: positioned relative to .scene */
    .hint {
      position: absolute;
      /* Golden ratio: 38.2% from left, ~23% from top — above the image */
      left: 38.2%;
      top: -72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      animation: hint-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      transform-origin: center bottom;
    }

    .hint.hiding {
      animation: hint-disappear 0.35s ease-in forwards;
    }

    @keyframes hint-appear {
      0%   { opacity: 0; transform: translateY(-12px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0)     scale(1); }
    }

    @keyframes hint-disappear {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-16px) scale(0.8); }
    }

    .hint-label {
      font-family: 'Georgia', serif;
      font-size: 15px;
      font-style: italic;
      color: #555;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .hint-arrow {
      /* Curved arrow pointing downward-right, drawn as inline SVG */
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">

    <!-- Hint overlay -->
    <div class="hint" id="hint">
      <span class="hint-label">click me</span>
      <svg class="hint-arrow" width="38" height="44" viewBox="0 0 38 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- curved path going down and slightly right -->
        <path d="M10 2 C6 14, 18 28, 22 40" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- arrowhead -->
        <path d="M22 40 L14 36 M22 40 L28 34" stroke="#888" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <div class="image-wrapper" id="wrapper">
      <img id="photo" src="" alt="Random cat photo" draggable="false">
    </div>

  </div>

  <script>
    const N = 13;

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function randomIndex(exclude) {
      let idx;
      do {
        idx = Math.floor(Math.random() * (N + 1));
      } while (idx === exclude && N > 0);
      return idx;
    }

    let currentIndex = null;

    function loadImage(idx) {
      const img = document.getElementById('photo');
      img.classList.add('fading');
      setTimeout(() => {
        img.src = `image/${pad(idx)}.jpg`;
        img.onload = () => img.classList.remove('fading');
        img.onerror = () => img.classList.remove('fading');
      }, 250);
      currentIndex = idx;
    }

    // Initial load
    currentIndex = randomIndex(-1);
    document.getElementById('photo').src = `image/${pad(currentIndex)}.jpg`;

    // Hint logic
    const hint = document.getElementById('hint');
    let hintDismissed = false;

    try {
      if (localStorage.getItem('2cats_hint_dismissed') === '1') {
        hint.style.display = 'none';
        hintDismissed = true;
      }
    } catch(e) {
      // localStorage blocked — fallback: show hint this session only
    }

    function dismissHint() {
      if (hintDismissed) return;
      hintDismissed = true;
      hint.classList.add('hiding');
      hint.addEventListener('animationend', () => {
        hint.style.display = 'none';
      }, { once: true });
      try { localStorage.setItem('2cats_hint_dismissed', '1'); } catch(e) {}
    }

    document.getElementById('wrapper').addEventListener('click', () => {
      dismissHint();
      loadImage(randomIndex(currentIndex));
    });
  </script>
</body>
</html>
